name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build (no instance config)
        run: npm run build
      - name: Build (example instance config)
        run: npm run build
        env:
          KUZUHA_CONFIG: deploy/example.json
